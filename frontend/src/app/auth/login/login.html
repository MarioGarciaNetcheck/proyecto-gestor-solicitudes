<h2>Iniciar sesión</h2>

<form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
  <label for="usuario">Usuario</label>
  <input id="usuario" type="text" formControlName="usuario" autocomplete="username" />

  <label for="contrasena">Contraseña</label>
  <input id="contrasena" type="password" formControlName="contrasena" autocomplete="current-password" />

  @if (formulario.invalid && formulario.touched) {
    <p class="mensaje-error">Introduzca usuario y contraseña.</p>
  }
  @if (error()) {
    <p class="mensaje-error">{{ error() }}</p>
  }

  <button type="submit" class="boton">Entrar</button>
</form>

<p class="nota">Usuarios de prueba: ana / ana123, luis / luis123 (rol USUARIO) y admin / admin123 (rol ADMIN).</p>
