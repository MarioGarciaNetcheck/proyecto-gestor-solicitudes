spring.application.name=gestor-solicitudes
server.port=8080

# --- Base de datos H2 en modo fichero: los datos se conservan entre reinicios ---
# El fichero se crea en la carpeta ./data del backend. Para empezar de cero, se borra esa carpeta.
spring.datasource.url=jdbc:h2:file:./data/solicitudes
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/solicitudes)
spring.h2.console.enabled=true

# Muestra en el log el SQL que genera JPA (útil para aprender; se desactiva en producción)
logging.level.org.hibernate.SQL=debug
