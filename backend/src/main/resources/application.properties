spring.application.name=gestor-solicitudes
server.port=8080

# --- Base de datos H2 en modo fichero: los datos se conservan entre reinicios ---
# El fichero se crea en la carpeta ./data del backend. Para empezar de cero, se borra esa carpeta.
spring.datasource.url=jdbc:h2:file:./data/solicitudes
spring.datasource.username=sa
# Los secretos no se escriben en el código: se leen de una variable de entorno.
# Si no existe DB_PASSWORD se usa una contraseña vacía (solo aceptable en este entorno didáctico).
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea o actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/solicitudes)
spring.h2.console.enabled=true

# Muestra en el log el SQL que genera JPA (útil para aprender; se desactiva en producción)
logging.level.org.hibernate.SQL=debug

# --- Seguridad: tokens JWT ---
# La clave de firma se lee de la variable de entorno JWT_SECRETO.
# El valor por defecto solo sirve para el entorno didáctico; en un entorno real no debe existir.
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-del-curso-cambiar-en-real-0123456789}
app.jwt.minutos-validez=60

# Nunca enviar trazas ni mensajes internos de error al cliente
# (en Spring Boot 4 estas propiedades se llaman spring.web.error.*; las antiguas server.error.* ya no tienen efecto)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
